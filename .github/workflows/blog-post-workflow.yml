name: Latest blog post workflow
on:
  schedule: 
    - cron: '0 0 1 * *'
  workflow_dispatch: 
concurrency:
  group: readme-update
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1
        with:
          feed_list: "https://qiita.com/nakamura0907/feed"
          max_post_count: 5

